name: APK bauen
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Android-Lizenzen bestaetigen
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Fester Schluessel
        env:
          KS_B64: ${{ secrets.FP_KS_B64 }}
          KS_PASS: ${{ secrets.FP_KS_PASS }}
        run: |
          if [ -n "$KS_B64" ]; then
            # Nur Base64-Zeichen behalten (Zeilenumbrueche, Leerzeichen usw. vom Kopieren fallen weg)
            printf '%s' "$KS_B64" | tr -cd 'A-Za-z0-9+/=' | base64 -d > "$RUNNER_TEMP/fp.keystore"
            if ! keytool -list -keystore "$RUNNER_TEMP/fp.keystore" -storepass "$KS_PASS" > /dev/null 2>&1; then
              echo "::error::Schluessel oder FP_KS_PASS passt nicht. Secrets FP_KS_B64 und FP_KS_PASS pruefen."
              exit 1
            fi
            echo "Fester Schluessel geladen"
            echo "FP_KS_PATH=$RUNNER_TEMP/fp.keystore" >> "$GITHUB_ENV"
          else
            echo "Kein fester Schluessel hinterlegt, Debug-Signatur"
          fi
      - run: gradle assembleDebug --no-daemon
        env:
          FP_KS_PASS: ${{ secrets.FP_KS_PASS }}
          FP_KS_ALIAS: ${{ secrets.FP_KS_ALIAS }}
          FP_KEY_PASS: ${{ secrets.FP_KEY_PASS }}
          FP_AC_DEBUG: ${{ secrets.FP_AC_DEBUG }}
      - uses: actions/upload-artifact@v4
        with:
          name: Familien-Planer-APK
          path: app/build/outputs/apk/debug/*.apk
